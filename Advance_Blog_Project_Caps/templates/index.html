{% include "header.html" %}

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8 text-center mb-5">
            <h1 class="fw-bold">The Clean Blog</h1>
            <p class="lead text-muted">A collection of thoughts, tutorials, and projects.</p>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            {% for post in posts %}
                <div class="card mb-4 shadow-sm border-0">
                    <div class="card-body">
                        <h2 class="card-title h4">{{ post['title']|title }}</h2>
                        <p class="card-text text-muted">{{ post['body'][:120] }}...</p>

                        <a href="{{ url_for('show_post', post_id=post['id']) }}" class="btn btn-outline-primary btn-sm">
                            Read More &rarr;
                        </a>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</div>

{% include "footer.html" %}
