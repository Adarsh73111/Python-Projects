{% extends "base.html" %}
{% from 'bootstrap5/form.html' import render_form %}

{% block title %}Add a Cafe{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <h1 class="mb-4">Add a new cafe into the database</h1>
        <p class="text-muted mb-4">Found a great new spot to work? Add it to the list!</p>

        {{ render_form(form) }}

    </div>
</div>
{% endblock %}
