<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .color-box {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            margin: 10px auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5 text-center">
        <h1 class="mb-4">Image Color Palette Generator</h1>
        <form method="POST" enctype="multipart/form-data" class="mb-5">
            <input type="file" name="file" class="form-control w-50 mx-auto mb-3" accept="image/*" required>
            <button type="submit" class="btn btn-primary">Generate Palette</button>
        </form>

        {% if image_url %}
        <div class="row justify-content-center mb-5">
            <div class="col-md-6">
                <img src="{{ image_url }}" class="img-fluid rounded shadow" alt="Uploaded Image">
            </div>
        </div>
        {% endif %}

        {% if colors %}
        <h3 class="mb-4">Top 10 Dominant Colors</h3>
        <div class="row justify-content-center">
            {% for color in colors %}
            <div class="col-md-2 col-sm-4 col-6 mb-4">
                <div class="color-box" style="background-color: {{ color }};"></div>
                <p class="text-muted fw-bold">{{ color }}</p>
            </div>
            {% endfor %}
        </div>
        {% endif %}
    </div>
</body>
</html>
