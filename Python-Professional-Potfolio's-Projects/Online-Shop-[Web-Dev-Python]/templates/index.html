<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Online Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="text-center mb-5">Course Checkout</h1>
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm text-center border-0">
                    <img src="https://via.placeholder.com/400x250?text=Python+Course" class="card-img-top" alt="Product Image">
                    <div class="card-body p-4">
                        <h4 class="card-title fw-bold">Advanced Python Developer Course</h4>
                        <p class="card-text text-muted mb-4">Complete module access including backend web development and API integrations.</p>
                        <h2 class="text-primary mb-4">$20.00</h2>
                        <form action="/create-checkout-session" method="POST">
                            <button type="submit" class="btn btn-primary btn-lg w-100">Pay securely with Stripe</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
