<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Todo List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="text-center mb-4">My Todo List</h2>

                        <form action="{{ url_for('add') }}" method="POST" class="mb-4">
                            <div class="input-group">
                                <input type="text" name="title" class="form-control" placeholder="What do you need to do?" required>
                                <button type="submit" class="btn btn-primary">Add Task</button>
                            </div>
                        </form>

                        <ul class="list-group">
                            {% for task in tasks %}
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <div>
                                    {% if task.is_completed %}
                                        <del class="text-muted">{{ task.title }}</del>
                                    {% else %}
                                        <span>{{ task.title }}</span>
                                    {% endif %}
                                </div>
                                <div>
                                    <a href="{{ url_for('update', task_id=task.id) }}" class="btn btn-sm {{ 'btn-warning' if task.is_completed else 'btn-success' }} me-2">
                                        {{ 'Undo' if task.is_completed else 'Done' }}
                                    </a>
                                    <a href="{{ url_for('delete', task_id=task.id) }}" class="btn btn-sm btn-danger">Delete</a>
                                </div>
                            </li>
                            {% else %}
                            <li class="list-group-item text-center text-muted">
                                No tasks yet. You're all caught up!
                            </li>
                            {% endfor %}
                        </ul>

                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
