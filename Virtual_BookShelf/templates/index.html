<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        ul { list-style: none; padding: 0; }
        li { margin: 15px 0; font-size: 18px; }
        a { text-decoration: none; color: #3498db; margin-left: 10px; }
        .delete { color: #e74c3c; }
    </style>
</head>
<body>
    <h1>My Library</h1>

    {% if books|length == 0 %}
        <p>Library is empty.</p>
    {% else %}
        <ul>
        {% for book in books %}
            <li>
                <strong>{{ book.title }}</strong> - {{ book.author }} - {{ book.rating }}/10
                <a href="{{ url_for('edit', id=book.id) }}">Edit Rating</a>
                <a class="delete" href="{{ url_for('delete', id=book.id) }}">Delete</a>
            </li>
        {% endfor %}
        </ul>
    {% endif %}

    <br>
    <a href="{{ url_for('add') }}">Add New Book</a>
</body>
</html>
