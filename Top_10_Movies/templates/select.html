{% extends 'base.html' %}
{% block title %}Select Movie{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 bg-white p-5 rounded shadow">
        <h1 class="mb-4 text-center fw-bold">Select Movie</h1>
        <ul class="list-group">
            {% for movie in options %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span><strong>{{ movie.title }}</strong> - {{ movie.release_date }}</span>
                <a href="{{ url_for('find_movie', id=movie.id) }}" class="btn btn-success btn-sm">Select</a>
            </li>
            {% endfor %}
        </ul>
        <div class="text-center mt-4">
            <a href="{{ url_for('add_movie') }}" class="btn btn-secondary">Search Again</a>
        </div>
    </div>
</div>
{% endblock %}
