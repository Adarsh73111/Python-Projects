{% extends 'base.html' %}
{% from 'bootstrap5/form.html' import render_form %}

{% block title %}Add Movie{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 bg-white p-5 rounded shadow">
        <h1 class="mb-4 text-center fw-bold">Add a Movie</h1>
        {{ render_form(form) }}
        <a href="{{ url_for('home') }}" class="btn btn-secondary mt-3 w-100">Cancel</a>
    </div>
</div>
{% endblock %}
